name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Run unit tests, lint, and build debug APK
        working-directory: numx-android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: NumX-debug-${{ github.sha }}
          path: numx-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NUMX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Repository secret NUMX_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/numx-release.jks"
          chmod 600 "$RUNNER_TEMP/numx-release.jks"

      - name: Build signed APK and AAB
        working-directory: numx-android
        env:
          NUMX_KEYSTORE_FILE: ${{ runner.temp }}/numx-release.jks
          NUMX_KEYSTORE_PASSWORD: ${{ secrets.NUMX_KEYSTORE_PASSWORD }}
          NUMX_KEY_ALIAS: ${{ secrets.NUMX_KEY_ALIAS }}
          NUMX_KEY_PASSWORD: ${{ secrets.NUMX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify signing certificate
        env:
          EXPECTED_SHA256: "AD68B964C22F1A826DBDEEEF31E3D04C5E86A80FF0066065FDA5CE39DFB0D991"
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs \
            numx-android/app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/apksigner.txt"
          ACTUAL_SHA256="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1)"
          ACTUAL_SHA256="${ACTUAL_SHA256//:/}"
          ACTUAL_SHA256="${ACTUAL_SHA256^^}"
          EXPECTED_SHA256="${EXPECTED_SHA256//:/}"
          EXPECTED_SHA256="${EXPECTED_SHA256^^}"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Signing certificate mismatch. Expected $EXPECTED_SHA256, got $ACTUAL_SHA256."
            exit 1
          fi

      - name: Prepare release files
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp numx-android/app/build/outputs/apk/release/app-release.apk "dist/NumX-${VERSION}.apk"
          cp numx-android/app/build/outputs/bundle/release/app-release.aab "dist/NumX-${VERSION}.aab"
          (
            cd dist
            sha256sum "NumX-${VERSION}.apk" "NumX-${VERSION}.aab" > SHA256SUMS.txt
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NumX-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "NumX $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
